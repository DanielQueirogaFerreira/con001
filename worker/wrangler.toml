# Cloudflare Worker for the private alpha.
#
# Deploy from the repository root:
#   npm run reader && npm run status        # build the assets first
#   npx wrangler d1 create open-hermeneutics # once; paste the id below
#   npx wrangler d1 execute open-hermeneutics --remote --file worker/schema.sql
#   npx wrangler deploy --config worker/wrangler.toml
#
# No API token is stored in this repository. `npx wrangler login` uses an OAuth
# flow in your browser. For CI, put a scoped token in a GitHub Actions secret —
# never in a file, and never pasted into a chat.

name = "open-hermeneutics"
main = "index.mjs"
compatibility_date = "2025-09-01"

# The Worker runs BEFORE static assets, so nothing under web/ is reachable
# without a session. Without run_worker_first the asset server answers first and
# the gate is decorative.
[assets]
directory = "../web"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "open-hermeneutics"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"

[observability]
enabled = true
