# Publishes the alpha site to GitHub Pages.
#
# MANUAL TRIGGER ONLY. There is deliberately no `on: push` here: this project
# publishes readings of other people's scripture, and nothing should reach the
# public because someone merged a branch. A person decides, every time.
#
# Before the first run, a repository admin must set
# Settings → Pages → Source to "GitHub Actions". Until then this workflow fails
# at the deploy step and publishes nothing.
#
# No secrets are required. Deployment runs under the repository's own
# GITHUB_TOKEN, so no API token for any third-party host needs to exist.
name: publish

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH to confirm this goes public'
        required: true
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "PUBLISH" ]; then
            echo "Confirmation not given. Type PUBLISH to publish." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm test

      # build:alpha ships without high-tier items awaiting advisory sign-off and
      # names them in dist/manifest.json. To refuse to publish at all while
      # anything is held, change this to `npm run build:prod`.
      - run: npm run build:alpha
      - run: npm run status

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp web/reader.html _site/index.html
          cp web/reader.html _site/reader.html
          cp web/status.html _site/status.html
          cp dist/manifest.json _site/manifest.json
          cp dist/version.json _site/version.json
          echo "Published build: $(node -e "console.log(require('./dist/version.json').build)")"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
