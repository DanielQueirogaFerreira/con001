# Deploys the private alpha to a Cloudflare Worker.
#
# MANUAL TRIGGER ONLY. There is deliberately no `on: push`: this project serves
# readings of other people's scripture, and nothing should be deployed because
# someone merged a branch. A person decides, every time.
#
# The site is NOT public. The Worker requires an email/password session before
# any asset is served — see docs/15-access.md. GitHub Pages is not used at all:
# private Pages requires GitHub Enterprise Cloud, so on this account Pages can
# only ever be public.
#
# THIS IS THE FALLBACK PATH. The preferred one is Cloudflare Workers Builds:
# connect this repository to the Worker in the Cloudflare dashboard and every
# push deploys automatically, with no API token existing anywhere. See
# wrangler.toml and docs/15-access.md.
#
# This workflow exists for the case where deploys must be driven from GitHub.
# It requires one repository secret, CLOUDFLARE_API_TOKEN, scoped to
# "Edit Cloudflare Workers" for this account only, added under
# Settings → Secrets and variables → Actions. It is never printed and never
# committed; wrangler reads it from the environment.
name: publish

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "DEPLOY" ]; then
            echo "Confirmation not given. Type DEPLOY to deploy." >&2
            exit 1
          fi

      - name: Check the deploy credential exists
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set on this repository." >&2
            echo "Add it under Settings -> Secrets and variables -> Actions." >&2
            echo "Scope it to 'Edit Cloudflare Workers' and nothing else." >&2
            exit 1
          fi
          echo "credential present"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tools/version.mjs needs real history for the build id

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm test

      # build:alpha ships without high-tier items awaiting advisory sign-off and
      # names them in dist/manifest.json. To refuse to deploy at all while
      # anything is held, change this to `npm run build:prod`.
      - run: npm run build:alpha
      - run: npm run status

      - name: Refuse to deploy an unconfigured database binding
        run: |
          if grep -q 'REPLACE_WITH_ID' wrangler.toml; then
            echo "wrangler.toml still has a placeholder database_id." >&2
            exit 1
          fi

      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy

      - name: Report what was deployed
        run: |
          node -e "console.log('deployed build:', require('./dist/version.json').build)"
          echo 'Held from this build:'
          node -e "for (const h of require('./dist/manifest.json').held) console.log(' -', h.id, '·', h.rfc, h.rfc_status)"
