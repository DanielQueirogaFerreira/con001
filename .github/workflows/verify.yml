# Certifies the LIVE site is gated, from outside.
#
# tools/verify-live.mjs has to run somewhere with real network access to the
# deployed Worker. That is the point of it: the failure it looks for — the asset
# server answering before the login gate — is invisible from the configuration
# and silent in the deploy log. So it runs here, on a GitHub runner, against the
# public URL, with no credentials of any kind.
#
# Runs after every publish, and on demand.
name: verify

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Site to certify'
        required: true
        default: 'https://con001.daniel-queiroga.workers.dev'
      probe:
        description: 'Single-use probe token, to also check the generation credential'
        required: false
        default: ''
  workflow_call:
    inputs:
      url:
        type: string
        required: true

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/verify-live.mjs "${{ inputs.url }}"

      # Asks the live Worker whether it holds a generation credential Google
      # accepts. The token is spent by the request, so it is worth nothing by
      # the time this log exists; the answer carries no key and no content.
      - name: Check the generation credential
        if: inputs.probe != ''
        env:
          PROBE: ${{ inputs.probe }}
        run: |
          set -eu
          out=$(curl -sS -X POST "${{ inputs.url }}/api/selftest" -H "X-Probe-Token: $PROBE")
          echo "$out"
          echo "$out" | grep -q '"credential":true' || { echo "no usable generation credential" >&2; exit 1; }
          echo "$out" | grep -q '"ok":true' || { echo "the credential reached no model" >&2; exit 1; }
          # Each provider is reported separately, so one working key cannot hide another
          # that is missing.
          for p in google openai; do
            echo "$out" | grep -q "\"provider\":\"$p\"" || { echo "$p was not checked at all" >&2; exit 1; }
          done
