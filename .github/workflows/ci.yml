# Runs on every push and pull request. Tests only — this workflow publishes
# nothing. Deployment is a separate, manually triggered workflow, so nothing
# reaches the public by merging a branch.
name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tools/version.mjs needs real git history for the build id

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No `npm ci` — the project has no dependencies, and keeping it that way
      # is a stated property (see README). If a lockfile ever appears here,
      # something has been added that should have been argued for first.
      - name: Assert the project is still dependency-free
        run: |
          node -e "
            const p = require('./package.json');
            const deps = { ...p.dependencies, ...p.devDependencies };
            if (Object.keys(deps).length) {
              console.error('Dependencies appeared:', Object.keys(deps).join(', '));
              process.exit(1);
            }
            console.log('dependency-free: ok');
          "

      - run: npm test

      - name: Build the alpha bundle (held items excluded and named)
        run: npm run build:alpha

      - name: Build the status page
        run: npm run status

      - name: Show what the advisory gate is holding
        run: cat dist/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            web/
            dist/
