# Pushes a generation credential from GitHub's secret store to the Worker's.
#
# There are two secret stores in this project and they are easy to confuse.
# CLOUDFLARE_API_TOKEN lives in GitHub, because Actions needs it to deploy.
# GEMINI_API_KEY has to live on the WORKER, because the running Worker is what
# calls Google — a GitHub secret is invisible to it. Setting the right value in
# the wrong store looks exactly like setting nothing at all.
#
# This workflow resolves that: name the secret in GitHub, and this puts it on
# the Worker with the token that already deploys. If the GitHub secret is empty
# it says so plainly, which narrows the problem to the Cloudflare side rather
# than leaving "it is set, but not really" hanging.
name: secret

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUT to push GEMINI_API_KEY to the Worker'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: worker-secret

jobs:
  put:
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation
        run: |
          [ "${{ inputs.confirm }}" = "PUT" ] || { echo "Type PUT to proceed." >&2; exit 1; }

      - uses: actions/checkout@v4

      - name: Put the key on the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -eu
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "GEMINI_API_KEY is not set in this REPOSITORY's secrets either." >&2
            echo "So the value lives (or does not) on the Cloudflare side only." >&2
            echo "Either add it here under Settings -> Secrets and variables -> Actions," >&2
            echo "or set it directly on the Worker: Cloudflare dashboard -> Workers & Pages" >&2
            echo "-> con001 -> Settings -> Variables and Secrets -> Add -> type Secret." >&2
            exit 1
          fi
          # The value is piped, never passed as an argument: arguments show up in
          # process listings, and wrangler echoes nothing it reads from stdin.
          printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@4 secret put GEMINI_API_KEY
          echo "GEMINI_API_KEY is now set on the Worker."
