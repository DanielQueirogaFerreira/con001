# Pushes a generation credential from GitHub's secret store to the Worker's.
#
# There are two secret stores in this project and they are easy to confuse.
# CLOUDFLARE_API_TOKEN lives in GitHub, because Actions needs it to deploy.
# GEMINI_API_KEY has to live on the WORKER, because the running Worker is what
# calls Google — a GitHub secret is invisible to it. Setting the right value in
# the wrong store looks exactly like setting nothing at all.
#
# This workflow resolves that: name the secret in GitHub, and this puts it on
# the Worker with the token that already deploys. If the GitHub secret is empty
# it says so plainly, which narrows the problem to the Cloudflare side rather
# than leaving "it is set, but not really" hanging.
name: secret

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUT to push the generation keys to the Worker'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: worker-secret

jobs:
  put:
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation
        run: |
          [ "${{ inputs.confirm }}" = "PUT" ] || { echo "Type PUT to proceed." >&2; exit 1; }

      - uses: actions/checkout@v4

      - name: Put the keys on the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY_CON001: ${{ secrets.OPENAI_API_KEY_CON001 }}
        run: |
          set -eu
          pushed=0
          put() {
            value=$(printenv "$1" || true)
            if [ -z "$value" ]; then
              echo "  $1 is not in this repository's secrets — skipped."
              return 0
            fi
            # Piped, never passed as an argument: arguments show up in process listings,
            # and wrangler echoes nothing it reads from stdin.
            printf '%s' "$value" | npx --yes wrangler@4 secret put "$1"
            echo "  $1 is now set on the Worker."
            pushed=$((pushed + 1))
          }

          # Named exactly as they are in the store. A secret whose name in the workflow
          # differs from its name in the settings page is an hour nobody gets back.
          put GEMINI_API_KEY
          put OPENAI_API_KEY_CON001

          if [ "$pushed" -eq 0 ]; then
            echo "Nothing was pushed: neither key is in this repository's secrets." >&2
            echo "Add them under Settings -> Secrets and variables -> Actions, or set them" >&2
            echo "directly on the Worker: Cloudflare dashboard -> Workers & Pages -> con001" >&2
            echo "-> Settings -> Variables and Secrets -> Add -> type Secret." >&2
            exit 1
          fi
